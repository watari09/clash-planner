<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Upgrade-Planer · Widget</title>
  <meta name="theme-color" content="#141a22">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <style>
    :root { --bg: #141a22; --card: #1d2430; --text: #e9edf3; --muted: #97a3b6; --line: #2c3544;
      --home: #f2c14e; --lab: #b48cff; --pets: #6fd38b; --bb: #6aa8ff; --ok: #6fd38b; }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { padding: 10px 12px; max-width: 520px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 8px; }
    h1 { font-size: 15px; margin: 0; }
    .muted { color: var(--muted); font-size: 12px; }
    ul { list-style: none; margin: 0 0 8px; padding: 0; }
    li { display: flex; gap: 8px; align-items: baseline; padding: 5px 0 5px 8px; border-left: 3px solid var(--line); margin-bottom: 3px; }
    li .at { min-width: 62px; font-variant-numeric: tabular-nums; font-weight: 600; }
    li .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    li.free .at { color: var(--ok); }
    li.free { background: color-mix(in srgb, var(--ok) 10%, transparent); border-radius: 0 8px 8px 0; }
    .g-home { border-left-color: var(--home); } .g-lab { border-left-color: var(--lab); }
    .g-pets { border-left-color: var(--pets); } .g-bb, .g-star { border-left-color: var(--bb); }
    .row { display: flex; gap: 12px; flex-wrap: wrap; font-size: 13px; }
    .row b { font-weight: 600; }
    .ico { width: 18px; height: 18px; vertical-align: -4px; margin-right: 3px; }
    .err { color: #ff9b7a; }
  </style>
  <script type="module" src="src/widget.js"></script>
</head>
<body>
  <main id="w"><p class="muted">…</p></main>
</body>
</html>
